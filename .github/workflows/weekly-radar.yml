name: Weekly trend radar

on:
  schedule:
    # Tuesdays 09:00 UTC = 12:00 Moscow. GitHub may start cron jobs a few
    # minutes late under load; that is fine for a weekly page.
    - cron: "0 9 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch live star counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-stars.js

      - name: Build page
        run: node build.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          if git diff --staged --quiet; then
            echo "nothing changed this week"
          else
            git commit -m "Weekly trend radar: $(date -u +%F)"
            git push
          fi
